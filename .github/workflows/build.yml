# The installers for Linux, Windows and macOS, as files of the run; a release gets them attached by hand.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported Ubuntu: its glibc keeps the .deb installable on newer ones
          - os: ubuntu-22.04
            args: --bundles deb
          - os: windows-latest
            args: --bundles nsis
          # one .dmg for Apple silicon and Intel Macs
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri's system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm test
      - run: npx tauri build ${{ matrix.args }}
      # "Git Krill_<version>_amd64.deb" and the like: git-krill_<version>_linux.deb, _windows.exe, _macOS.dmg, as the releases name them
      - name: Collect the installer
        shell: bash
        run: |
          mkdir out
          for f in src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            [ -e "$f" ] && cp "$f" "out/$(basename "$f" | sed 's/^Git Krill_/git-krill_/; s/_amd64\.deb$/_linux.deb/; s/_x64-setup\.exe$/_windows.exe/; s/_universal\.dmg$/_macOS.dmg/')"
          done
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: git-krill-${{ matrix.os }}
          path: out/*
          if-no-files-found: error
