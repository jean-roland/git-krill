[package]
name = "krill"
version = "0.2.0"
description = "Lean git client"
authors = ["Jean-Roland Gosse <jean.roland.gosse@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "krill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the picker in the desktop portal (zenity else), out of process: GTK's own crashed krill when typing a path
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread"] }
tauri-plugin-window-state = "2"
# the askpass key
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
