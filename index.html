<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Krill</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <nav id="tabs">
      <div id="tablist"></div>
      <button id="new-tab" title="New tab (Ctrl+T)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="tab-find" title="Search tabs"><svg data-icon="caret"></svg></button>
      <div id="tab-search" hidden>
        <input id="tab-q" placeholder="Search tabs" spellcheck="false" />
        <div class="head">Open tabs</div>
        <div id="tab-hits"></div>
      </div>
    </nav>
    <header>
      <div class="top-side"><span class="ico" id="repo-ico"></span><span id="repo-name"></span><span class="ico" id="branch-ico"></span><span id="branch"></span></div>
      <div class="top-mid">
        <button class="tool" id="undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
        <button class="tool" id="redo" title="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>Redo</button>
        <i class="sep"></i>
        <button class="tool" data-op="fetch" title="Fetch all remotes"><svg viewBox="0 0 24 24"><path d="M12 13v8m-4-4 4 4 4-4M4.4 15.3A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.4 8.3"/></svg>Fetch</button>
        <button class="tool" id="pull" data-op="pull" title="Pull"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></svg>Pull<small id="behind"></small></button>
        <button class="tool caret" id="pull-mode" title="Pull mode"><svg data-icon="caret"></svg></button>
        <button class="tool" data-op="push" title="Push"><svg viewBox="0 0 24 24"><path d="M12 21V9m-5 5 5-5 5 5M5 3h14"/></svg>Push<small id="ahead"></small></button>
        <i class="sep"></i>
        <button class="tool" data-op="stash-push" title="Stash all changes"><svg data-icon="stash"></svg>Stash</button>
        <button class="tool" data-op="stash-pop" title="Pop the last stash"><svg viewBox="0 0 24 24"><path d="M3 4h18v4H3zM5 8v12h14V8M12 18v-6m-3 3 3-3 3 3"/></svg>Pop</button>
        <i class="sep"></i>
        <button class="tool" id="term-btn" title="Terminal (Ctrl+`)"><svg viewBox="0 0 24 24"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Terminal</button>
      </div>
      <div class="top-side right">
        <span id="opstate" hidden title="Show the work in progress"><b id="opname"></b> in progress</span>
      </div>
    </header>
    <main>
      <div class="col-grip" id="sidebar-grip"></div>
      <div class="col-grip" id="details-grip"></div>
      <aside id="sidebar"></aside>
      <section id="center">
        <div id="view">
          <div id="home" hidden>
            <div class="home-box">
              <h1>Welcome to Git Krill</h1>
              <div class="home-actions">
                <button id="open-repo" class="tinted" title="Ctrl+O"><svg data-icon="folderOpen"></svg>Open repository…</button>
                <button id="clone-btn" class="tinted"><svg data-icon="globe"></svg>Clone repository…</button>
                <button id="init-repo" class="tinted"><svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5zM12 11v6M9 14h6"/></svg>Init repository…</button>
              </div>
              <div class="head">Recent</div>
              <div id="recent"></div>
            </div>
          </div>
          <div id="find" hidden>
            <input id="find-q" placeholder="Search commits: message, author, branch, hash" spellcheck="false" />
            <small id="find-n"></small>
            <button class="icon" id="find-prev" title="Previous (Shift+Enter)"><svg data-icon="up"></svg></button>
            <button class="icon" id="find-next" title="Next (Enter)"><svg data-icon="down"></svg></button>
            <button class="icon" id="find-close" title="Close (Esc)"><svg data-icon="close"></svg></button>
          </div>
          <div id="graph">
            <div id="cols"><span class="refs">Branch / Tag</span><span class="g-col">Graph</span><span class="subject">Commit message</span></div>
            <div id="rows"></div>
          </div>
          <div id="diff" hidden>
            <div class="bar">
              <span id="diff-path"></span>
              <button class="icon" id="prev-change" title="Previous change"><svg data-icon="up"></svg></button>
              <button class="icon" id="next-change" title="Next change"><svg data-icon="down"></svg></button>
              <span class="seg">
                <button data-mode="hunk" title="Changed hunks only"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 9h11M4 15h16M4 19h11"/></svg>Hunk</button><button data-mode="inline" title="Whole file, one column"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h16M4 20h16"/></svg>Inline</button><button data-mode="split" title="Whole file, side by side"><svg viewBox="0 0 24 24"><path d="M3 4h18v16H3zM12 4v16"/></svg>Split</button>
              </span>
              <button id="diff-save" class="primary" hidden>Save</button>
              <button id="diff-history" title="The commits that touched this file"><svg viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2"/></svg>File history</button>
              <button id="open-editor" title="Open the working tree file in VS Code"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Open in editor</button>
              <button class="icon" id="diff-close" title="Close (Esc)"><svg data-icon="close"></svg></button>
            </div>
            <div id="diff-editor"></div>
            <div id="diff-binary" hidden></div>
            <div id="hist-file" hidden></div>
          </div>
          <div id="hist" hidden>
            <div class="col-grip" id="hist-grip"></div>
            <div class="bar">
              <span id="hist-path"></span>
              <span class="hist-mid">
                <span class="seg">
                  <button data-hview="file" title="The file as of the commit"><svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7zM14 3v4h4"/></svg>File</button><button data-hview="diff" title="The commit's changes to the file"><svg viewBox="0 0 24 24"><path d="M12 4v16M5 7h4M7 5v4M15 17h4"/></svg>Diff</button>
                </span>
                <button id="hist-blame" class="toggle"><svg viewBox="0 0 24 24"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg>Blame</button>
              </span>
              <button class="icon" id="hist-close" title="Close (Esc)"><svg data-icon="close"></svg></button>
            </div>
            <div id="hist-list"></div>
            <div id="hist-main"></div>
          </div>
          <div id="merge" hidden>
            <div class="bar">
              <span id="m-path"></span>
              <span id="m-count"></span>
              <button id="m-sync" class="toggle" title="Scroll the three panes together"><svg viewBox="0 0 24 24"><path d="M8 3v18M16 3v18M4 17l4 4 4-4M12 17l4 4 4-4"/></svg>Sync scrolling</button>
              <button id="m-reset" title="Drop the picks and edits"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5"/></svg>Reset</button>
              <button id="m-save" class="primary" title="Write the output and mark the file resolved (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM7 3v5h8V3M7 21v-7h10v7"/></svg>Save</button>
              <button class="icon" id="m-close" title="Close (Esc)"><svg data-icon="close"></svg></button>
            </div>
            <div class="m-sides">
              <div class="m-side"><label class="m-head"><input type="checkbox" id="m-all-a" /><b class="m-tag a">A</b>current <code id="m-a-commit"></code> on <b id="m-a-name"></b></label><div id="m-a" class="m-ed"></div></div>
              <div class="m-side"><label class="m-head"><input type="checkbox" id="m-all-b" /><b class="m-tag b">B</b>incoming <code id="m-b-commit"></code> on <b id="m-b-name"></b></label><div id="m-b" class="m-ed"></div></div>
            </div>
            <div class="m-head m-out-head">
              <span>Output</span>
              <span class="m-nav">
                <button class="icon" id="m-prev" title="Previous conflict"><svg data-icon="up"></svg></button>
                <span id="m-at"></span>
                <button class="icon" id="m-next" title="Next conflict"><svg data-icon="down"></svg></button>
              </span>
            </div>
            <div id="m-out" class="m-ed"></div>
          </div>
        </div>
        <div id="term" hidden>
          <div id="term-grip"></div>
          <div class="term-bar">Terminal<button id="term-close" title="Close (Ctrl+`)">×</button></div>
        </div>
      </section>
      <aside id="details">
        <div id="wip">
          <div class="panel-title wip-head">
            <button id="discard-all" title="Discard all changes"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg></button>
            <span id="wip-title"></span>
          </div>
          <div class="files-opts"><span class="files-opts-left"><button class="sort" title="Sort the files"></button><button class="tree-all" data-open="1" title="Expand all folders"><svg viewBox="0 0 24 24"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg></button><button class="tree-all" data-open="" title="Collapse all folders"><svg viewBox="0 0 24 24"><path d="m7 20 5-5 5 5M7 4l5 5 5-5"/></svg></button></span><span class="seg"><button data-files="path" title="One row per file, folders in front"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Path</button><button data-files="tree" title="Files under their folders"><svg viewBox="0 0 24 24"><path d="M4 5h8M7 5v13a1 1 0 0 0 1 1h9M7 12h10"/></svg>Tree</button></span><span></span><input class="file-filter" placeholder="Filter files" spellcheck="false" /></div>
          <div class="head"><span id="unstaged-label">Unstaged Files</span> <span id="unstaged-n"></span><button id="stage-all" class="good">Stage all changes</button></div>
          <div id="unstaged" class="files"></div>
          <div class="head"><span id="staged-label">Staged Files</span> <span id="staged-n"></span><button id="unstage-all" class="bad">Unstage all changes</button></div>
          <div id="staged" class="files"></div>
          <div id="commit-box">
            <div class="commit-box-head">Commit<button id="amend" class="toggle" title="Rewrite the previous commit with the staged changes and this message"><svg data-icon="m"></svg>Amend</button></div>
            <div class="summary"><input id="summary" class="msg-in" placeholder="Summary" spellcheck="false" /><small id="summary-n"></small></div>
            <textarea id="desc" class="msg-in" placeholder="Description" spellcheck="false"></textarea>
            <button id="commit-btn" class="primary"></button>
            <div id="op-btns" hidden><button id="op-continue" class="primary"></button><button id="op-skip">Skip commit</button><button id="op-abort" class="bad"></button></div>
          </div>
        </div>
        <div id="commit" hidden>
          <div id="commit-head" class="panel-title"></div>
          <div id="commit-msg"><div id="commit-summary"></div><div id="commit-desc"></div></div>
          <div id="commit-grip" title="Drag to resize"></div>
          <div id="commit-author"></div>
          <div id="commit-stats" class="panel-title"></div>
          <div class="files-opts"><span class="files-opts-left"><button class="sort" title="Sort the files"></button><button class="tree-all" data-open="1" title="Expand all folders"><svg viewBox="0 0 24 24"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg></button><button class="tree-all" data-open="" title="Collapse all folders"><svg viewBox="0 0 24 24"><path d="m7 20 5-5 5 5M7 4l5 5 5-5"/></svg></button></span><span class="seg"><button data-files="path" title="One row per file, folders in front"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Path</button><button data-files="tree" title="Files under their folders"><svg viewBox="0 0 24 24"><path d="M4 5h8M7 5v13a1 1 0 0 0 1 1h9M7 12h10"/></svg>Tree</button></span><button id="all-files" class="toggle" title="List every file of the commit, not only the changed ones"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>View all files</button><input class="file-filter" placeholder="Filter files" spellcheck="false" /></div>
          <div id="commit-files" class="files"></div>
        </div>
      </aside>
    </main>
    <footer id="status"></footer>
    <div id="menu" class="menu" hidden></div>
    <div id="submenu" class="menu" hidden></div>
    <div id="banner" hidden></div>
    <div id="dialog" hidden></div>
    <div id="toasts"></div>
    <div id="loading" hidden><div class="spinner"></div><span id="loading-label"></span></div>
    <svg id="sprites" width="0" height="0" aria-hidden="true"></svg>
  </body>
</html>
